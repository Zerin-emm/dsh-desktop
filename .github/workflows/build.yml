name: Build DSH Desktop

# Upstream publishes DSH NEXT as `v<version>-next`. This workflow rebuilds the newest such tag as
# DSH Desktop, and can be pointed at any tag by hand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag such as v2.0.24-next (empty picks the newest)
        required: false
        type: string
  schedule:
    # 04:07 UTC is 12:07 in Beijing; upstream releases weekly, so a daily check is enough.
    - cron: '7 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: anywhere-labs/dsh-desktop
  # The builds otherwise fetch Electron and its packaging binaries from GitHub, which is slow here.
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  resolve:
    name: Resolve upstream tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      exists: ${{ steps.pick.outputs.exists }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED}" ]; then
            tag="${REQUESTED}"
          else
            # `-next` tags are the released stream; `-beta.N` tags are prereleases this build skips.
            tag="$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=30" \
              --jq '[.[] | select(.tag_name | endswith("-next"))][0].tag_name')"
          fi
          if [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
            echo "No upstream -next tag found" >&2
            exit 1
          fi
          version="${tag#v}"
          version="${version%-next}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # A release that already exists means this build is complete; skip the expensive jobs.
          if gh release view "v${version}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Windows installer
    needs: resolve
    if: needs.resolve.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream at the tag
        shell: pwsh
        run: |
          git clone --depth 1 --branch "${{ needs.resolve.outputs.tag }}" `
            "https://github.com/${{ env.UPSTREAM_REPO }}.git" upstream
          # The pinned harness is a submodule and the payload step reads its primary-runtime manifest,
          # which a plain --depth 1 clone leaves empty.
          git -C upstream submodule update --init --recursive --depth 1

      - name: Apply the overlay
        shell: pwsh
        run: |
          # Only new files live here, so this never conflicts with upstream.
          Copy-Item -Recurse -Force overlay/* upstream/

      - name: Rewrite DSH NEXT into DSH Desktop
        shell: pwsh
        run: node scripts/rename.mjs upstream "${{ needs.resolve.outputs.version }}" "${{ github.repository }}"

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install
        working-directory: upstream
        shell: pwsh
        # The root postinstall applies patches/ to the official packages.
        run: corepack yarn install --immutable

      - name: Build
        working-directory: upstream/dsh-desktop-next
        shell: pwsh
        run: corepack yarn build

      - name: Check the specs against the recorded baseline
        shell: pwsh
        # The specs that assert the replaced product name, update endpoint and installer switches fail
        # by design and are listed in .known-test-failures.json. A failure outside that list means a
        # patch reached further than intended, or upstream changed behaviour under it.
        run: node scripts/check-tests.mjs --desktop-root upstream/dsh-desktop-next

      - name: Package the portable archive and the application directory
        working-directory: upstream/dsh-desktop-next
        shell: pwsh
        env:
          # The build above already ran the same preflight; repeating it would build the client twice.
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        # `dist:win-portable` produces dist\win-unpacked and the zip beside it, and runs its own
        # verifier over both. The archive is published for people who want no installer; the updater
        # never touches it, because the download URL names the Inno Setup file. The upstream NSIS
        # target and its own `yarn dist:win` entry point stay untouched and uncalled.
        run: corepack yarn dist:win-portable

      - name: Install Inno Setup
        shell: pwsh
        # The Windows runner image does not ship it, and the chocolatey package is the quickest route.
        run: choco install innosetup --no-progress -y

      - name: Build the Inno Setup installer
        shell: pwsh
        # Independent of the upstream tree: it reads dist\win-unpacked and writes the installer beside it.
        run: node scripts/package-inno.mjs "${{ needs.resolve.outputs.version }}" "${{ github.repository }}" --desktop-root upstream/dsh-desktop-next

      - name: Collect the installer and describe it
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          $exe = "upstream/dsh-desktop-next/dist/DSH-Desktop-Setup-$version-x64.exe"
          $zip = "upstream/dsh-desktop-next/dist/DSH-Desktop-$version-x64-Portable.zip"
          if (-not (Test-Path $exe)) { throw 'No installer was produced' }
          if (-not (Test-Path $zip)) { throw 'No portable archive was produced' }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # A fixed asset name keeps releases/latest/download/<name> pointing at the newest build.
          Copy-Item $exe 'out/DSH-Desktop-win-x64.exe'
          Copy-Item $zip 'out/DSH-Desktop-win-x64-Portable.zip'
          $sha = (Get-FileHash 'out/DSH-Desktop-win-x64.exe' -Algorithm SHA256).Hash.ToLower()
          New-Item -ItemType Directory -Force -Path pages | Out-Null
          $payload = [ordered]@{
            version = $version
            channel = 'stable'
            sha256  = [ordered]@{ windows = $sha }
          }
          # The updater's client parses exactly these three fields and rejects a redirect, so this
          # file is served as a plain static document.
          $payload | ConvertTo-Json -Compress | Set-Content -NoNewline 'pages/version.json' -Encoding utf8
          Get-Content 'pages/version.json'
          "VERSION=$version" | Out-File -Append -FilePath $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop
          path: |
            out/DSH-Desktop-win-x64.exe
            out/DSH-Desktop-win-x64-Portable.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: pages
          path: pages/
          if-no-files-found: error

  build-macos:
    name: Build macOS disk image
    needs: resolve
    if: needs.resolve.outputs.exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream at the tag
        # The pinned harness is a submodule and the payload step reads its primary-runtime manifest,
        # which a plain --depth 1 clone leaves empty.
        run: |
          git clone --depth 1 --branch "${{ needs.resolve.outputs.tag }}" "https://github.com/${UPSTREAM_REPO}.git" upstream
          git -C upstream submodule update --init --recursive --depth 1

      - name: Apply the overlay
        run: cp -R overlay/. upstream/

      - name: Rewrite DSH NEXT into DSH Desktop
        run: node scripts/rename.mjs upstream "${{ needs.resolve.outputs.version }}" "${{ github.repository }}"

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        working-directory: upstream
        # The root postinstall applies patches/ to the official packages.
        run: corepack yarn install --immutable

      - name: Build
        working-directory: upstream/dsh-desktop-next
        run: corepack yarn build

      - name: Package the unsigned disk image
        working-directory: upstream/dsh-desktop-next
        # `mac-smoke` needs no signing identity: it builds the app and the DMG, then verifies the
        # sealed payload, the fuses and the packaged Host boot. Gatekeeper clears it after
        # `xattr -cr /Applications/DSH\ Desktop.app`.
        run: corepack yarn dist:mac-smoke

      - name: Collect the disk image
        run: |
          set -euo pipefail
          mkdir -p out
          dmg="$(find upstream/dsh-desktop-next/dist -maxdepth 2 -name '*.dmg' | head -n 1)"
          if [ -z "${dmg}" ]; then echo 'No disk image was produced' >&2; exit 1; fi
          cp "${dmg}" out/DSH-Desktop-mac-x64.dmg
          shasum -a 256 out/DSH-Desktop-mac-x64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-macos
          path: out/DSH-Desktop-mac-x64.dmg
          if-no-files-found: error

  build-linux:
    name: Build Linux packages
    needs: resolve
    if: needs.resolve.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream at the tag
        # The pinned harness is a submodule and the payload step reads its primary-runtime manifest,
        # which a plain --depth 1 clone leaves empty.
        run: |
          git clone --depth 1 --branch "${{ needs.resolve.outputs.tag }}" "https://github.com/${UPSTREAM_REPO}.git" upstream
          git -C upstream submodule update --init --recursive --depth 1

      - name: Apply the overlay
        run: cp -R overlay/. upstream/

      - name: Rewrite DSH NEXT into DSH Desktop
        run: node scripts/rename.mjs upstream "${{ needs.resolve.outputs.version }}" "${{ github.repository }}"

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        working-directory: upstream
        # The root postinstall applies patches/ to the official packages.
        run: corepack yarn install --immutable

      - name: Build
        working-directory: upstream/dsh-desktop-next
        run: corepack yarn build

      - name: Package the AppImage and the Debian package
        working-directory: upstream/dsh-desktop-next
        run: corepack yarn dist:linux

      - name: Collect the packages
        run: |
          set -euo pipefail
          mkdir -p out
          appimage="$(find upstream/dsh-desktop-next/dist -maxdepth 2 -name '*.AppImage' | head -n 1)"
          deb="$(find upstream/dsh-desktop-next/dist -maxdepth 2 -name '*.deb' | head -n 1)"
          if [ -z "${appimage}" ]; then echo 'No AppImage was produced' >&2; exit 1; fi
          if [ -z "${deb}" ]; then echo 'No Debian package was produced' >&2; exit 1; fi
          cp "${appimage}" out/DSH-Desktop-linux-x86_64.AppImage
          cp "${deb}" out/DSH-Desktop-linux-amd64.deb
          sha256sum out/DSH-Desktop-linux-x86_64.AppImage out/DSH-Desktop-linux-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux
          path: |
            out/DSH-Desktop-linux-x86_64.AppImage
            out/DSH-Desktop-linux-amd64.deb
          if-no-files-found: error

  publish-pages:
    name: Publish the version endpoint
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages
          path: pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@v4

  publish-release:
    name: Publish the release
    needs: [resolve, build, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-macos
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-linux
          path: out

      - name: Take the upstream notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${UPSTREAM_REPO}/releases/tags/${{ needs.resolve.outputs.tag }}" \
            --jq .body > notes.md || echo "" > notes.md
          # The notes describe the upstream build this one is; only the product name differs, in both
          # spellings used across release bodies (display name and artifact name).
          sed -i 's/DSH NEXT/DSH Desktop/g; s/DSH-NEXT/DSH-Desktop/g' notes.md
          cat >> notes.md <<'EOF'

          ---

          **个人构建，基于 __UPSTREAM_TAG__。**

          | 平台 | 文件 | 自动更新 |
          |---|---|---|
          | Windows | `DSH-Desktop-win-x64.exe`（Inno Setup） | 是 |
          | Windows | `DSH-Desktop-win-x64-Portable.zip`（免安装） | 否 |
          | macOS | `DSH-Desktop-mac-x64.dmg`（未签名，`xattr -cr` 后可用） | 否 |
          | Linux | `.AppImage` / `.deb` | 否 |

          安装包与便携包的区别：安装包注册开始菜单、桌面快捷方式与卸载项，并参与应用内更新；
          便携包解压即用，不写注册表，更新需要手动下载新包。
          EOF
          sed -i "s/__UPSTREAM_TAG__/${{ needs.resolve.outputs.tag }}/" notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve.outputs.version }}
          name: DSH Desktop ${{ needs.resolve.outputs.version }}
          body_path: notes.md
          files: |
            out/DSH-Desktop-win-x64.exe
            out/DSH-Desktop-win-x64-Portable.zip
            out/DSH-Desktop-mac-x64.dmg
            out/DSH-Desktop-linux-x86_64.AppImage
            out/DSH-Desktop-linux-amd64.deb
          fail_on_unmatched_files: true
